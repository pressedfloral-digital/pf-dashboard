name: Assignment count regression tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:assignment-counts
      - run: npx tsc --noEmit
